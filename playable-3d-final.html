<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>命运塔 Tower of Fate - 3D正式版</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            font-family: "Microsoft YaHei", -apple-system, sans-serif;
            overflow: hidden;
            color: white;
        }
        
        /* 加载画面 */
        #loading-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s;
        }
        .loading-tower {
            width: 100px; height: 200px;
            background: linear-gradient(180deg, #ffd700 0%, #ff8c00 100%);
            clip-path: polygon(20% 0%, 80% 0%, 100% 100%, 0% 100%);
            animation: loadingPulse 1s ease-in-out infinite;
        }
        @keyframes loadingPulse { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.1); } }
        .loading-text { margin-top: 30px; font-size: 24px; color: #ffd700; }
        .loading-subtext { margin-top: 10px; font-size: 14px; color: #888; }
        
        /* 游戏主容器 */
        #game-container {
            position: relative;
            width: 100vw; height: 100vh;
        }
        #canvas-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }
        
        /* UI层级 */
        .ui-layer {
            position: absolute;
            pointer-events: none;
            z-index: 10;
        }
        .ui-layer.interactive { pointer-events: auto; }
        
        /* 顶部状态栏 */
        .hud-top {
            top: 0; left: 0; right: 0;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, transparent 100%);
        }
        
        /* 钻石计数器 */
        .diamond-counter {
            display: flex; align-items: center; gap: 10px;
            background: linear-gradient(135deg, rgba(0,212,255,0.3), rgba(0,102,255,0.3));
            border: 2px solid #00d4ff;
            border-radius: 30px;
            padding: 8px 20px;
        }
        .diamond-icon {
            width: 28px; height: 28px;
            background: linear-gradient(135deg, #00d4ff, #0066ff);
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
            animation: diamondPulse 2s ease-in-out infinite;
        }
        @keyframes diamondPulse { 0%, 100% { transform: scale(1) rotate(0deg); } 50% { transform: scale(1.1) rotate(180deg); } }
        .diamond-count { font-size: 24px; font-weight: 900; color: #00d4ff; }
        
        /* 塔信息 */
        .tower-info {
            text-align: center;
            background: linear-gradient(135deg, rgba(255,215,0,0.2), rgba(255,140,0,0.2));
            border: 2px solid #ffd700;
            border-radius: 20px;
            padding: 12px 25px;
            max-width: 300px;
        }
        .tower-name { font-size: 20px; font-weight: 900; color: #ffd700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .tower-level { font-size: 14px; color: #fff; margin-top: 4px; }
        
        /* 回合指示器 */
        .turn-indicator {
            background: linear-gradient(135deg, rgba(0,255,136,0.3), rgba(0,204,102,0.3));
            border: 2px solid #00ff88;
            border-radius: 20px;
            padding: 8px 20px;
            font-size: 16px;
            font-weight: 900;
            color: #00ff88;
        }
        .turn-indicator.opponent {
            background: linear-gradient(135deg, rgba(255,107,107,0.3), rgba(196,69,105,0.3));
            border-color: #ff6b6b;
            color: #ff6b6b;
        }
        
        /* 左侧进度面板 - 优化：更紧凑 */
        .progress-panel {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.7);
            border-radius: 15px;
            padding: 12px;
            max-height: 65vh;
            overflow-y: auto;
            min-width: 100px;
        }
        .progress-title {
            color: #ffd700;
            font-weight: 900;
            margin-bottom: 8px;
            text-align: center;
            font-size: 13px;
        }
        .layer-indicator {
            display: flex; align-items: center; gap: 6px;
            margin: 4px 0;
            padding: 4px 8px;
            border-radius: 6px;
            opacity: 0.5;
            font-size: 12px;
            transition: all 0.3s;
        }
        .layer-indicator.active {
            opacity: 1;
            background: linear-gradient(90deg, rgba(0,255,136,0.3), transparent);
        }
        .layer-indicator.current {
            opacity: 1;
            background: linear-gradient(90deg, rgba(255,215,0,0.4), transparent);
            border-left: 2px solid #ffd700;
        }
        .layer-indicator.first-climber {
            background: linear-gradient(90deg, rgba(255,0,255,0.4), transparent);
            border-left: 2px solid #ff00ff;
        }
        .layer-dot { width: 8px; height: 8px; border-radius: 50%; background: #666; }
        .layer-indicator.active .layer-dot { background: #00ff88; }
        .layer-indicator.current .layer-dot { background: #ffd700; animation: dotPulse 1s infinite; }
        .layer-indicator.first-climber .layer-dot { background: #ff00ff; }
        @keyframes dotPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.3); } }
        
        /* 右侧激怒牌面板 - 优化：移到左边 */
        .anger-panel {
            position: absolute;
            left: 130px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.7);
            border-radius: 15px;
            padding: 12px;
            border: 2px solid #ff4757;
            min-width: 100px;
        }
        .anger-title {
            color: #ff4757;
            font-weight: 900;
            margin-bottom: 8px;
            text-align: center;
            font-size: 13px;
        }
        .anger-cards-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .anger-card {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 5px 8px;
            background: linear-gradient(135deg, rgba(255,71,87,0.3), rgba(196,69,105,0.3));
            border: 1px solid #ff4757;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .anger-card:hover { transform: scale(1.05); }
        .anger-card.triggered {
            animation: angerFlash 0.5s ease-in-out 3;
            background: linear-gradient(135deg, rgba(255,0,0,0.8), rgba(139,0,0,0.8));
        }
        @keyframes angerFlash { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        
        /* 层叠区面板 - 优化：移到右侧 */
        .stack-panel {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.7);
            border-radius: 15px;
            padding: 12px;
            border: 2px solid #9b59b6;
            min-width: 120px;
        }
        .stack-title {
            color: #9b59b6;
            font-weight: 900;
            margin-bottom: 8px;
            text-align: center;
            font-size: 13px;
        }
        .stack-cards-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 200px;
            overflow-y: auto;
        }
        .stack-card {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 5px 8px;
            background: linear-gradient(135deg, rgba(155,89,182,0.3), rgba(142,68,173,0.3));
            border: 1px solid #9b59b6;
            border-radius: 6px;
            font-size: 12px;
        }
        
        /* 守卫牌显示区 - 优化：居中上方 */
        .guard-panel {
            position: absolute;
            left: 50%;
            top: 12%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            border-radius: 20px;
            padding: 15px 25px;
            border: 2px solid #9b59b6;
            text-align: center;
        }
        .guard-title {
            color: #9b59b6;
            font-weight: 900;
            margin-bottom: 12px;
            font-size: 14px;
        }
        .guard-cards-display {
            display: flex;
            gap: 8px;
            justify-content: center;
        }
        .guard-card {
            width: 50px; height: 70px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: 2px solid #fff;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }
        .guard-card.hidden {
            background: linear-gradient(135deg, #2c3e50 0%, #1a1a2e 100%);
        }
        .guard-card.hidden::after {
            content: "❓";
            font-size: 20px;
        }
        .guard-card.revealed {
            background: linear-gradient(135deg, #fff 0%, #f0f0f0 100%);
            border-color: #ffd700;
            animation: cardFlip 0.6s ease-in-out;
        }
        @keyframes cardFlip {
            0% { transform: rotateY(0deg); }
            50% { transform: rotateY(90deg); }
            100% { transform: rotateY(0deg); }
        }
        .guard-card .suit { font-size: 16px; }
        .guard-card .rank { font-size: 14px; font-weight: bold; }
        
        /* 当前守卫显示 */
        .current-guard-info {
            position: absolute;
            left: 50%;
            top: 5%;
            transform: translateX(-50%);
            background: rgba(155,89,182,0.3);
            border: 2px solid #9b59b6;
            border-radius: 15px;
            padding: 8px 20px;
            font-size: 16px;
            font-weight: 900;
            color: #9b59b6;
        }
        
        /* 手牌区域 */
        .hand-cards-container {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            z-index: 30;
            pointer-events: auto;
            width: 90%;
            max-width: 800px;
        }
        .hand-cards-info {
            background: rgba(0,0,0,0.6);
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 13px;
            color: #00d4ff;
        }
        .hand-cards-warning {
            background: rgba(255,71,87,0.8);
            color: #fff;
            animation: warningPulse 1s infinite;
        }
        @keyframes warningPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        .hand-cards {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            max-width: 100%;
            padding: 10px;
            background: rgba(0,0,0,0.4);
            border-radius: 15px;
            scroll-snap-type: x mandatory;
        }
        .card {
            min-width: 55px; height: 77px;
            background: linear-gradient(135deg, #fff 0%, #f0f0f0 100%);
            border: 2px solid #ddd;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            scroll-snap-align: center;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transform-style: preserve-3d;
        }
        .card:hover { transform: translateY(-10px) scale(1.05); }
        .card.selected {
            border: 3px solid #ffd700;
            transform: translateY(-15px) scale(1.1);
            box-shadow: 0 10px 30px rgba(255,215,0,0.5);
            z-index: 100;
        }
        .card.playing {
            animation: cardFly3D 1s ease-in-out forwards;
        }
        @keyframes cardFly3D {
            0% { transform: translateY(-15px) scale(1.1) rotateY(0deg); }
            50% { transform: translateY(-150px) scale(0.8) rotateY(180deg); opacity: 0.8; }
            100% { transform: translateY(-250px) scale(0.5) rotateY(360deg); opacity: 0; }
        }
        .card .suit { font-size: 20px; }
        .card .rank { font-size: 18px; font-weight: bold; }
        .card.red { color: #e74c3c; }
        .card.black { color: #2c3e50; }
        
        /* 操作按钮 */
        .action-buttons {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            pointer-events: auto;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn-action {
            padding: 12px 28px;
            font-size: 16px;
            font-weight: 900;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-action:hover {
            transform: translateY(-3px) scale(1.05);
        }
        .btn-play {
            background: linear-gradient(135deg, #00ff88 0%, #00cc66 100%);
            color: #000;
            box-shadow: 0 5px 20px rgba(0,255,136,0.4);
        }
        .btn-play:disabled {
            background: #666;
            color: #999;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .btn-auto {
            background: linear-gradient(135deg, #9b59b6 0%, #8e44ad 100%);
            color: #fff;
        }
        
        /* 游戏记录面板 - 优化：显示轮次 */
        .game-record-panel {
            position: absolute;
            bottom: 280px;
            left: 15px;
            background: rgba(0,0,0,0.8);
            border-radius: 15px;
            padding: 12px;
            max-width: 220px;
            max-height: 180px;
            overflow-y: auto;
        }
        .record-title {
            color: #ffd700;
            font-weight: 900;
            margin-bottom: 8px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .record-item {
            padding: 6px 10px;
            margin: 4px 0;
            background: rgba(255,255,255,0.1);
            border-radius: 6px;
            font-size: 11px;
            border-left: 2px solid #00d4ff;
        }
        .record-round { color: #00d4ff; font-weight: bold; }
        .record-action { color: #fff; margin-top: 2px; }
        .record-time { color: #888; font-size: 10px; }
        
        /* 通知弹窗 */
        .notification {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.95);
            border: 3px solid #ffd700;
            border-radius: 20px;
            padding: 25px 40px;
            text-align: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s;
            min-width: 280px;
        }
        .notification.show {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1.05);
        }
        .notification-title { font-size: 24px; font-weight: 900; color: #ffd700; margin-bottom: 8px; }
        .notification-text { font-size: 14px; color: #fff; }
        .notification.success { border-color: #00ff88; }
        .notification.success .notification-title { color: #00ff88; }
        .notification.error { border-color: #ff4757; }
        .notification.error .notification-title { color: #ff4757; }
        .notification.warning { border-color: #ffa502; }
        .notification.warning .notification-title { color: #ffa502; }
        
        /* 晋级提示 */
        .level-up-indicator {
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 42px;
            font-weight: 900;
            color: #ffd700;
            text-shadow: 0 0 30px rgba(255,215,0,0.8);
            opacity: 0;
            pointer-events: none;
            z-index: 500;
        }
        .level-up-indicator.show {
            animation: levelUpPop 2s ease-out forwards;
        }
        @keyframes levelUpPop {
            0% { opacity: 0; transform: translateX(-50%) scale(0.5); }
            20% { opacity: 1; transform: translateX(-50%) scale(1.2); }
            80% { opacity: 1; transform: translateX(-50%) scale(1) translateY(-30px); }
            100% { opacity: 0; transform: translateX(-50%) scale(1) translateY(-50px); }
        }
        
        /* 首登者标识 */
        .first-climber-badge {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #ff00ff, #ff1493);
            padding: 20px 40px;
            border-radius: 20px;
            font-size: 24px;
            font-weight: 900;
            color: #fff;
            text-align: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            box-shadow: 0 0 50px rgba(255,0,255,0.5);
        }
        .first-climber-badge.show {
            animation: firstClimberAnim 3s ease-out forwards;
        }
        @keyframes firstClimberAnim {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
            30% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
            70% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
        }
        
        /* 玩家头像 */
        .player-avatars {
            position: absolute;
            right: 15px;
            top: 15%;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .player-avatar {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0,0,0,0.6);
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
        }
        .player-avatar .avatar-img {
            width: 28px; height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }
        .player-avatar.active { border: 2px solid #00ff88; }
        .player-avatar.first-climber { border: 2px solid #ff00ff; }
        
        /* 游戏结束弹窗 */
        .game-over-modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }
        .game-over-modal.show { display: flex; }
        .game-over-content {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border: 4px solid #ffd700;
            border-radius: 30px;
            padding: 40px;
            max-width: 450px;
            text-align: center;
            animation: modalPop 0.5s ease;
        }
        @keyframes modalPop { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .game-over-title { font-size: 36px; font-weight: 900; color: #ffd700; margin-bottom: 15px; }
        .game-over-text { font-size: 16px; color: #fff; margin-bottom: 25px; }
        .game-over-buttons { display: flex; gap: 15px; justify-content: center; }
        .btn-modal { padding: 12px 25px; font-size: 14px; font-weight: 900; border: none; border-radius: 25px; cursor: pointer; transition: all 0.3s; }
        .btn-modal:hover { transform: scale(1.1); }
        .btn-restart { background: linear-gradient(135deg, #00ff88, #00cc66); color: #000; }
        .btn-exit { background: linear-gradient(135deg, #ff4757, #c44569); color: #fff; }
        
        /* 匹配结果提示 */
        .match-result {
            position: absolute;
            top: 40%; left: 50%;
            transform: translateX(-50%);
            font-size: 32px;
            font-weight: 900;
            opacity: 0;
            pointer-events: none;
            z-index: 500;
        }
        .match-result.show { animation: matchResultPop 1.5s ease-out forwards; }
        @keyframes matchResultPop {
            0% { opacity: 0; transform: translateX(-50%) scale(0.5); }
            30% { opacity: 1; transform: translateX(-50%) scale(1.1); }
            100% { opacity: 0; transform: translateX(-50%) scale(1) translateY(-50px); }
        }
        .match-result.perfect { color: #00ff88; text-shadow: 0 0 20px rgba(0,255,136,0.8); }
        .match-result.partial { color: #ffa502; text-shadow: 0 0 20px rgba(255,165,2,0.8); }
        .match-result.fail { color: #ff4757; text-shadow: 0 0 20px rgba(255,71,87,0.8); }
        
        /* 滚动条样式 */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: rgba(255,255,255,0.1); border-radius: 2px; }
        ::-webkit-scrollbar-thumb { background: #ffd700; border-radius: 2px; }
        ::-webkit-scrollbar-thumb:hover { background: #ff8c00; }
        
        /* 响应式 */
        @media (max-width: 768px) {
            .hand-cards-container { bottom: 80px; }
            .card { min-width: 45px; height: 63px; }
            .card .suit { font-size: 16px; }
            .card .rank { font-size: 14px; }
            .btn-action { padding: 10px 20px; font-size: 14px; }
            .progress-panel { left: 5px; padding: 8px; min-width: 80px; }
            .anger-panel { left: 100px; padding: 8px; min-width: 80px; }
            .stack-panel { right: 5px; padding: 8px; min-width: 90px; }
            .guard-panel { padding: 10px 15px; }
            .guard-card { width: 40px; height: 56px; }
        }
    </style>
</head>
<body>
    <!-- 加载画面 -->
    <div id="loading-screen">
        <div class="loading-tower"></div>
        <div class="loading-text">正在加载命运塔...</div>
        <div class="loading-subtext">3D版本 v3.0</div>
    </div>
    
    <!-- 游戏容器 -->
    <div id="game-container">
        <div id="canvas-container"></div>
        
        <!-- UI层 -->
        <div class="hud-top ui-layer">
            <div class="diamond-counter interactive">
                <div class="diamond-icon"></div>
                <div class="diamond-count" id="diamondCount">1000</div>
            </div>
            <div class="tower-info">

/**
 * 游戏主类
 */
class TowerOfFateGame {
    constructor() {
        this.state = {
            currentLayer: 0,
            currentGuard: 0,
            playerLayer: 0,
            playerHand: [],
            guards: [],
            angerCards: [],
            stackCards: [], // 层叠区
            firstClimber: null,
            isPlayerTurn: true,
            gameRecords: [],
            currentRound: 1,
            diamonds: 1000,
            towerCode: 'CN',
            players: [],
            revealedCards: new Set(),
            selectedCardIndex: null,
            isGameOver: false
        };
        
        this.threeJS = {
            scene: null,
            camera: null,
            renderer: null,
            tower: null,
            playerToken: null,
            otherPlayerTokens: [],
            controls: null,
            particles: []
        };
        
        this.sounds = {};
        this.init();
    }
    
    init() {
        this.initThreeJS();
        this.initAudio();
        this.initPlayers();
        this.initGuards();
        this.initAngerCards();
        this.initStackCards();
        this.initPlayerHand();
        this.selectRandomTower();
        this.createUI();
        
        setTimeout(() => {
            document.getElementById('loading-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('loading-screen').style.display = 'none';
                this.showNotification('游戏开始', '命运塔3D版已准备好，开始你的冒险吧！', 'success');
            }, 500);
        }, 2000);
        
        this.animate();
    }
    
    // ===== Three.js 3D渲染 =====
    initThreeJS() {
        const container = document.getElementById('canvas-container');
        
        // 场景
        this.threeJS.scene = new THREE.Scene();
        this.threeJS.scene.fog = new THREE.FogExp2(0x1a1a2e, 0.012);
        
        // 相机
        this.threeJS.camera = new THREE.PerspectiveCamera(
            60, window.innerWidth / window.innerHeight, 0.1, 500
        );
        this.threeJS.camera.position.set(0, 10, 18);
        
        // 渲染器
        this.threeJS.renderer = new THREE.WebGLRenderer({
            antialias: true, alpha: true, powerPreference: "high-performance"
        });
        this.threeJS.renderer.setSize(window.innerWidth, window.innerHeight);
        this.threeJS.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        this.threeJS.renderer.shadowMap.enabled = true;
        this.threeJS.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(this.threeJS.renderer.domElement);
        
        // 控制器
        this.threeJS.controls = new THREE.OrbitControls(
            this.threeJS.camera, this.threeJS.renderer.domElement
        );
        this.threeJS.controls.enableDamping = true;
        this.threeJS.controls.dampingFactor = 0.05;
        this.threeJS.controls.minDistance = 8;
        this.threeJS.controls.maxDistance = 40;
        this.threeJS.controls.maxPolarAngle = Math.PI / 2;
        
        // 灯光
        this.setupLighting();
        
        // 环境
        this.createEnvironment();
        
        // 创建塔和玩家
        this.createTower();
        this.createPlayerToken();
        
        // 窗口调整
        window.addEventListener('resize', () => this.onWindowResize());
    }
    
    setupLighting() {
        const ambient = new THREE.AmbientLight(0x404080, 0.6);
        this.threeJS.scene.add(ambient);
        
        const sunLight = new THREE.DirectionalLight(0xffd700, 0.8);
        sunLight.position.set(10, 20, 10);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 1024;
        sunLight.shadow.mapSize.height = 1024;
        this.threeJS.scene.add(sunLight);
        
        const topLight = new THREE.PointLight(0xffd700, 1, 20);
        topLight.position.set(0, 18, 0);
        this.threeJS.scene.add(topLight);
        
        // 守卫层灯光
        for (let i = 0; i < 3; i++) {
            const guardLight = new THREE.PointLight(0xff0000, 0.5, 10);
            guardLight.position.set(0, 3 + i * 3, 0);
            this.threeJS.scene.add(guardLight);
        }
    }
    
    createEnvironment() {
        // 天空
        const skyGeo = new THREE.SphereGeometry(150, 32, 32);
        const skyMat = new THREE.MeshBasicMaterial({
            color: 0x1a1a2e, side: THREE.BackSide
        });
        this.threeJS.scene.add(new THREE.Mesh(skyGeo, skyMat));
        
        // 星星
        const starGeo = new THREE.BufferGeometry();
        const starCount = 800;
        const positions = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount * 3; i += 3) {
            positions[i] = (Math.random() - 0.5) * 300;
            positions[i + 1] = Math.random() * 150;
            positions[i + 2] = (Math.random() - 0.5) * 300;
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        this.threeJS.scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({
            color: 0xffffff, size: 0.5
        })));
        
        // 云朵
        this.createClouds();
    }
    
    createClouds() {
        const cloudCount = 12;
        const cloudGeo = new THREE.SphereGeometry(1, 8, 8);
        const cloudMat = new THREE.MeshPhongMaterial({
            color: 0xffffff, transparent: true, opacity: 0.4
        });
        
        for (let i = 0; i < cloudCount; i++) {
            const cloud = new THREE.Group();
            const puffs = 4 + Math.floor(Math.random() * 3);
            
            for (let j = 0; j < puffs; j++) {
                const puff = new THREE.Mesh(cloudGeo, cloudMat);
                puff.position.set(
                    (Math.random() - 0.5) * 4,
                    (Math.random() - 0.5) * 1.5,
                    (Math.random() - 0.5) * 2
                );
                puff.scale.setScalar(0.5 + Math.random() * 0.8);
                cloud.add(puff);
            }
            
            cloud.position.set(
                (Math.random() - 0.5) * 60,
                5 + Math.random() * 15,
                (Math.random() - 0.5) * 60 - 10
            );
            cloud.userData = {
                speed: 0.005 + Math.random() * 0.01,
                originalY: cloud.position.y
            };
            this.threeJS.scene.add(cloud);
        }
    }
    
    createTower() {
        this.threeJS.tower = new THREE.Group();
        const colors = [
            0xff1493, 0xff69b4, 0xffa500, 0xffff00, 0x00ff00,
            0x00ffff, 0x0000ff, 0x8b00ff, 0xff00ff, 0xff1493,
            0xff6347, 0xff4500, 0xdc143c
        ];
        
        // 材质缓存
        const materialCache = {};
        const getMaterial = (color) => {
            if (!materialCache[color]) {
                materialCache[color] = new THREE.MeshPhongMaterial({
                    color: color, emissive: color, emissiveIntensity: 0.2
                });
            }
            return materialCache[color];
        };
        
        // 创建13层 - 3D塔结构
        for (let i = 0; i < 13; i++) {
            const width = 3.5 - (i * 0.18);
            const geometry = new THREE.CylinderGeometry(width, width + 0.15, 0.9, 12);
            const material = getMaterial(colors[i]);
            const layer = new THREE.Mesh(geometry, material);
            layer.position.y = i * 1.0;
            layer.castShadow = true;
            layer.receiveShadow = true;
            
            // 层标签
            const canvas = document.createElement('canvas');
            canvas.width = 128; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#FFD700';
            ctx.font = 'bold 64px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(CONFIG.LAYER_NAMES[i], 64, 64);
            
            const texture = new THREE.CanvasTexture(canvas);
            const labelGeo = new THREE.PlaneGeometry(0.8, 0.8);
            const labelMat = new THREE.MeshBasicMaterial({
                map: texture, transparent: true
            });
            const label = new THREE.Mesh(labelGeo, labelMat);
            label.position.set(0, 0, width + 0.15);
            layer.add(label);
            
            // 发光环
            if (i % 3 === 0) {
                const ringGeo = new THREE.TorusGeometry(width + 0.2, 0.05, 8, 24);
                const ringMat = new THREE.MeshBasicMaterial({
                    color: 0xffd700, transparent: true, opacity: 0.6
                });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.rotation.x = Math.PI / 2;
                ring.position.y = 0.45;
                layer.add(ring);
            }
            
            this.threeJS.tower.add(layer);
        }
        
        // 塔基
        const base = new THREE.Mesh(
            new THREE.CylinderGeometry(4, 4.5, 0.8, 16),
            new THREE.MeshStandardMaterial({ color: 0x4a4a4a })
        );
        base.position.y = -0.5;
        this.threeJS.tower.add(base);
        
        // 塔顶 - 金色尖顶
        const top = new THREE.Mesh(
            new THREE.ConeGeometry(1, 3, 16),
            new THREE.MeshPhongMaterial({
                color: 0xffd700, emissive: 0xffd700, emissiveIntensity: 0.5
            })
        );
        top.position.y = 13.5;
        this.threeJS.tower.add(top);
        
        // 塔顶光球
        const topLight = new THREE.Mesh(
            new THREE.SphereGeometry(0.5, 16, 16),
            new THREE.MeshBasicMaterial({ color: 0xffd700 })
        );
        topLight.position.y = 15;
        this.threeJS.tower.add(topLight);
        
        // 创建守卫
        this.createGuards();
        
        this.threeJS.scene.add(this.threeJS.tower);
    }

        const targetCamY = 10 + this.state.playerLayer * 1.0;
        this.animateValue(this.threeJS.camera.position, 'y', targetCamY, 1000);
    }
    
    animateValue(obj, prop, target, duration) {
        const start = obj[prop];
        const change = target - start;
        const startTime = performance.now();
        
        const update = (currentTime) => {
            const elapsed = currentTime - startTime;
            const progress = Math.min(elapsed / duration, 1);
            const easeProgress = 1 - Math.pow(1 - progress, 3);
            obj[prop] = start + change * easeProgress;
            
            if (progress < 1) {
                requestAnimationFrame(update);
            }
        };
        requestAnimationFrame(update);
    }
    
    // ===== 音频 =====
    initAudio() {
        this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
    }
    
    playSound(type) {
        if (!this.audioContext) return;
        
        const oscillator = this.audioContext.createOscillator();
        const gainNode = this.audioContext.createGain();
        
        oscillator.connect(gainNode);
        gainNode.connect(this.audioContext.destination);
        
        const sounds = {
            play: { freq: 440, type: 'sine', duration: 0.1 },
            match: { freq: 880, type: 'sine', duration: 0.3 },
            anger: { freq: 220, type: 'sawtooth', duration: 0.5 },
            climb: { freq: 660, type: 'square', duration: 0.2 },
            win: { freq: 1320, type: 'sine', duration: 1 },
            flip: { freq: 550, type: 'sine', duration: 0.15 }
        };
        
        const sound = sounds[type] || sounds.play;
        oscillator.frequency.value = sound.freq;
        oscillator.type = sound.type;
        
        gainNode.gain.setValueAtTime(0.2, this.audioContext.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + sound.duration);
        
        oscillator.start(this.audioContext.currentTime);
        oscillator.stop(this.audioContext.currentTime + sound.duration);
    }

    // ===== 游戏操作 =====
    selectCard(index) {
        if (!this.state.isPlayerTurn || this.state.isGameOver) {
            this.showNotification('等待中', '请等待你的回合', 'warning');
            return;
        }
        
        document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
        
        const cardEl = document.getElementById(`hand-card-${index}`);
        if (cardEl) {
            cardEl.classList.add('selected');
            this.state.selectedCardIndex = index;
        }
    }
    
    playCard() {
        if (!this.state.isPlayerTurn || this.state.isGameOver) {
            this.showNotification('等待中', '请等待你的回合', 'warning');
            return;
        }
        
        if (this.state.selectedCardIndex === null) {
            this.showNotification('提示', '请先选择一张卡牌！', 'warning');
            return;
        }
        
        const card = this.state.playerHand[this.state.selectedCardIndex];
        if (!card) return;
        
        this.playSound('play');
        
        // 3D出牌动画
        const cardEl = document.getElementById(`hand-card-${this.state.selectedCardIndex}`);
        if (cardEl) {
            cardEl.classList.add('playing');
        }
        
        setTimeout(() => {
            this.processCardPlay(card);
        }, 800);
    }
    
    autoPlay() {
        if (!this.state.isPlayerTurn || this.state.isGameOver) {
            this.showNotification('等待中', '请等待你的回合', 'warning');
            return;
        }
        
        // 自动选择最佳卡牌
        const currentGuard = this.state.guards[this.state.currentGuard];
        let bestIndex = 0;
        let bestScore = -1;
        
        this.state.playerHand.forEach((card, index) => {
            let score = 0;
            if (card.suit === currentGuard.suit) score += 2;
            if (card.rank === CONFIG.RANKS[this.state.currentLayer]) score += 2;
            
            // 检查激怒牌
            const angerMatch = this.state.angerCards.some(anger => 
                anger.layer === this.state.currentLayer &&
                anger.suit === card.suit && 
                anger.rank === card.rank
            );
            if (angerMatch) score -= 5;
            
            if (score > bestScore) {
                bestScore = score;
                bestIndex = index;
            }
        });
        
        this.selectCard(bestIndex);
        setTimeout(() => this.playCard(), 300);
    }
    
    processCardPlay(card) {
        const currentGuard = this.state.guards[this.state.currentGuard];
        
        let matchType = 'none';
        const suitMatch = card.suit === currentGuard.suit;
        const rankMatch = card.rank === CONFIG.RANKS[this.state.currentLayer];
        
        if (suitMatch && rankMatch) {
            matchType = 'perfect';
        } else if (suitMatch || rankMatch) {
            matchType = 'partial';
        }
        
        const angerMatch = this.checkAngerCardMatch(card);
        
        this.executeMatchResult(matchType, angerMatch);
        
        // 添加到层叠区
        this.state.stackCards.unshift(card);
        if (this.state.stackCards.length > 10) {
            this.state.stackCards.pop();
        }
        
        // 从手牌移除
        this.state.playerHand.splice(this.state.selectedCardIndex, 1);
        this.state.selectedCardIndex = null;
        
        this.addGameRecord(`打出 ${card.suit}${card.rank} - ${this.getMatchText(matchType)}`);
        
        this.createPlayerHandUI();
        this.createStackCardsUI();
        this.updateUI();
        
        // 检查手牌用完
        if (this.state.playerHand.length === 0) {
            this.state.isGameOver = true;
            setTimeout(() => this.showGameOver('手牌已用完', '你的手牌已经全部打完了！'), 500);
            return;
        }
        
        // 切换到AI回合
        this.state.isPlayerTurn = false;
        this.updateTurnIndicator();
        
        setTimeout(() => this.aiTurn(), 1500);
    }
    
    checkAngerCardMatch(card) {
        const currentLayerAnger = this.state.angerCards.filter(
            c => c.layer === this.state.currentLayer
        );
        
        return currentLayerAnger.some(anger => 
            anger.suit === card.suit && anger.rank === card.rank
        );
    }
    
    executeMatchResult(matchType, angerMatch) {
        const matchTexts = {
            perfect: { text: '完美匹配! +2层', class: 'perfect', layers: 2 },
            partial: { text: '部分匹配! +1层', class: 'partial', layers: 1 },
            none: { text: '未匹配', class: 'fail', layers: 0 }
        };
        
        const result = matchTexts[matchType];
        this.showMatchResult(result.text, result.class);
        
        if (result.layers > 0) {
            this.playSound('match');
            
            if (angerMatch) {
                this.triggerAngerCard();
                return;
            }
            
            setTimeout(() => {
                this.climbLayers(result.layers);
            }, 1000);
        } else {
            this.playSound('anger');
            if (angerMatch) {
                this.triggerAngerCard();
            }
        }
    }
    
    getMatchText(matchType) {
        const texts = {
            perfect: '完美匹配',
            partial: '部分匹配',
            none: '未匹配'
        };
        return texts[matchType] || '未知';
    }
    
    showMatchResult(text, className) {
        const el = document.getElementById('matchResult');
        el.textContent = text;
        el.className = `match-result ${className} show`;
        
        setTimeout(() => {
            el.classList.remove('show');
        }, 1500);
    }
    
    triggerAngerCard() {
        this.playSound('anger');
        
        document.querySelectorAll('.anger-card').forEach(card => {
            card.classList.add('triggered');
        });
        
        this.showNotification('⚠️ 激怒牌触发!', '匹配到激怒牌，回退1层！', 'error');
        this.addGameRecord('⚠️ 触发激怒牌，回退1层');
        
        setTimeout(() => {
            document.querySelectorAll('.anger-card').forEach(card => {
                card.classList.remove('triggered');
            });
            
            if (this.state.playerLayer > 0) {
                this.state.playerLayer--;
                this.updatePlayerPosition();
                this.updateUI();
            }
        }, 1500);
    }
    
    climbLayers(layers) {
        this.playSound('climb');
        
        const oldLayer = this.state.playerLayer;
        this.state.playerLayer = Math.min(this.state.playerLayer + layers, 12);
        
        // 检查首登者
        if (this.state.playerLayer === 12 && !this.state.firstClimber) {
            this.becomeFirstClimber();
        }
        
        this.state.currentLayer = this.state.playerLayer;
        this.state.currentGuard = this.state.playerLayer;
        
        this.updatePlayerPosition();
        
        if (this.state.playerLayer > oldLayer) {
            this.showLevelUp();
        }
        
        this.createAngerCardsUI();
        this.createGuardCardsUI();
        this.updateUI();
        
        if (this.state.playerLayer === 12) {
            setTimeout(() => this.showVictory(), 1000);
        }
    }
    
    showLevelUp() {
        const el = document.getElementById('levelUpIndicator');
        el.classList.add('show');
        
        this.createClimbEffect();
        
        setTimeout(() => {
            el.classList.remove('show');
        }, 2000);
    }
    
    createClimbEffect() {
        const particleCount = 40;
        const particles = new THREE.Group();
        
        for (let i = 0; i < particleCount; i++) {
            const particle = new THREE.Mesh(
                new THREE.SphereGeometry(0.08, 6, 6),
                new THREE.MeshBasicMaterial({
                    color: new THREE.Color().setHSL(Math.random(), 1, 0.5)
                })
            );
            
            const pos = this.threeJS.playerToken.position.clone();
            particle.position.set(
                pos.x + (Math.random() - 0.5) * 3,
                pos.y + (Math.random() - 0.5) * 1.5,
                pos.z + (Math.random() - 0.5) * 3
            );
            
            particle.userData = {
                velocity: new THREE.Vector3(
                    (Math.random() - 0.5) * 0.15,
                    Math.random() * 0.4 + 0.2,
                    (Math.random() - 0.5) * 0.15
                )
            };
            
            particles.add(particle);
        }
        
        this.threeJS.scene.add(particles);
        
        const animateParticles = () => {
            let alive = false;
            particles.children.forEach(p => {
                if (p.scale.x > 0.01) {
                    p.position.add(p.userData.velocity);
                    p.userData.velocity.y -= 0.008;
                    p.scale.multiplyScalar(0.97);
                    alive = true;
                }
            });
            
            if (alive) {
                requestAnimationFrame(animateParticles);
            } else {
                this.threeJS.scene.remove(particles);
            }
        };
        
        animateParticles();
    }
    
    becomeFirstClimber() {
        this.state.firstClimber = 0;
        this.state.players[0].isFirstClimber = true;
        
        const badge = document.getElementById('firstClimberBadge');
        badge.classList.add('show');
        
        const halo = this.threeJS.playerToken.getObjectByName('firstClimberHalo');
        if (halo) {
            halo.material.opacity = 0.8;
        }
        
        this.showNotification('👑 首位登顶!', '你已成为首登者，变身为最高层守卫！', 'success');
        this.addGameRecord('👑 成为首位登顶者，变身为守卫！');
        
        this.createPlayerAvatarsUI();
        
        setTimeout(() => {
            badge.classList.remove('show');
        }, 3000);
    }
    
    aiTurn() {
        this.state.players.forEach((player, i) => {
            if (i === 0 || !player.isAI) return;
            
            const climb = Math.floor(Math.random() * 3);
            if (climb > 0 && player.layer < 12) {
                player.layer = Math.min(player.layer + climb, 12);
                
                if (player.layer === 12 && !this.state.firstClimber) {
                    this.state.firstClimber = i;
                    player.isFirstClimber = true;
                    this.addGameRecord(`${player.name} 成为首位登顶者！`);
                }
                
                if (this.threeJS.otherPlayerTokens[i - 1]) {
                    const targetY = player.layer * 1.0;
                    this.animateValue(
                        this.threeJS.otherPlayerTokens[i - 1].position,
                        'y', targetY, 1000
                    );
                }
            }
        });
        
        this.createPlayerAvatarsUI();
        
        setTimeout(() => {
            this.state.isPlayerTurn = true;
            this.updateTurnIndicator();
        }, 1000);
    }
    
    updateTurnIndicator() {
        const indicator = document.getElementById('turnIndicator');
        if (this.state.isPlayerTurn) {
            indicator.textContent = '你的回合';
            indicator.classList.remove('opponent');
        } else {
            indicator.textContent = '对手回合';
            indicator.classList.add('opponent');
        }
    }
    
    revealGuardCard(index) {
        const guard = this.state.guards[this.state.currentGuard];
        if (!guard || !guard.cards[index]) return;
        
        const card = guard.cards[index];
        card.revealed = true;
        
        const el = document.getElementById(`guard-card-${index}`);
        if (el) {
            el.className = 'guard-card revealed';
            const color = (card.suit === '♥' || card.suit === '♦') ? '#e74c3c' : '#2c3e50';
            el.innerHTML = `
                <span class="suit" style="color: ${color}">${card.suit}</span>
                <span class="rank" style="color: ${color}">${card.rank}</span>
            `;
        }
        
        this.playSound('flip');
    }
    
    addGameRecord(action) {
        const record = {
            round: this.state.currentRound,
            action: action,
            layer: CONFIG.LAYER_NAMES[this.state.playerLayer] || '2',
            timestamp: new Date().toLocaleTimeString('zh-CN', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' })
        };
        
        this.state.gameRecords.unshift(record);
        if (this.state.gameRecords.length > 15) {
            this.state.gameRecords.pop();
        }
        
        const container = document.getElementById('gameRecords');
        container.innerHTML = this.state.gameRecords.map(r => `
            <div class="record-item">
                <div class="record-round">第${r.round}轮 ${r.layer}层</div>
                <div class="record-action">${r.action}</div>
                <div class="record-time">${r.timestamp}</div>
            </div>
        `).join('');
        
        this.state.currentRound++;
        document.getElementById('roundDisplay').textContent = this.state.currentRound;
    }
    
    updateUI() {
        for (let i = 0; i < 13; i++) {
            const el = document.getElementById(`layer-${i}`);
            if (!el) continue;
            
            el.classList.remove('active', 'current', 'first-climber');
            
            if (i < this.state.playerLayer) {
                el.classList.add('active');
            } else if (i === this.state.playerLayer) {
                el.classList.add('current');
            }
            
            if (this.state.firstClimber !== null && i === 12) {
                el.classList.add('first-climber');
            }
        }
        
        document.getElementById('currentLayer').textContent = 
            CONFIG.LAYER_NAMES[this.state.playerLayer] + '层';
        
        document.getElementById('playBtn').disabled = !this.state.isPlayerTurn;
        document.getElementById('autoBtn').disabled = !this.state.isPlayerTurn;
    }
    
    showNotification(title, text, type = 'success') {
        const notif = document.getElementById('notification');
        const titleEl = document.getElementById('notifTitle');
        const textEl = document.getElementById('notifText');
        
        titleEl.textContent = title;
        textEl.textContent = text;
        
        notif.className = `notification ${type} show`;
        
        setTimeout(() => {
            notif.classList.remove('show');
        }, 2500);
    }
    
    showGameOver(title, text) {
        document.getElementById('gameOverTitle').textContent = title;
        document.getElementById('gameOverText').textContent = text;
        document.getElementById('gameOverModal').classList.add('show');
    }
    
    showVictory() {
        this.playSound('win');
        this.showGameOver('🏆 恭喜通关!', '你已经登顶命运塔，获得了最终胜利！');
    }
    
    restart() {
        location.reload();
    }
    
    exit() {
        if (confirm('确定要退出游戏吗？')) {
            window.location.href = 'index.html';
        }
    }
    
    onWindowResize() {
        this.threeJS.camera.aspect = window.innerWidth / window.innerHeight;
        this.threeJS.camera.updateProjectionMatrix();
        this.threeJS.renderer.setSize(window.innerWidth, window.innerHeight);
    }
    
    animate() {
        requestAnimationFrame(() => this.animate());
        
        const time = performance.now() * 0.001;
        
        // 塔旋转
        if (this.threeJS.tower) {
            this.threeJS.tower.rotation.y = Math.sin(time * 0.08) * 0.08;
        }
        
        // 玩家动画
        if (this.threeJS.playerToken) {
            const baseY = this.state.playerLayer * 1.0;
            this.threeJS.playerToken.position.y = baseY + Math.sin(time * 2) * 0.05;
            this.threeJS.playerToken.rotation.y += 0.008;
            
            // 首登者光环旋转
            const halo = this.threeJS.playerToken.getObjectByName('firstClimberHalo');
            if (halo && halo.material.opacity > 0) {
                halo.rotation.z += 0.02;
            }
        }
        
        // 其他玩家动画
        this.threeJS.otherPlayerTokens.forEach((token, i) => {
            const baseY = this.state.players[i + 1]?.layer * 1.0 || 0;
            token.position.y = baseY + Math.sin(time * 2 + i) * 0.05;
            token.rotation.y += 0.008;
        });
        
        this.threeJS.controls.update();
        this.threeJS.renderer.render(this.threeJS.scene, this.threeJS.camera);
    }
}

// 启动游戏
let game;
window.onload = () => {
    game = new TowerOfFateGame();
};
</script>
</body>
