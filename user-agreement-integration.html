<!-- user-agreement-integration.html -->
<!-- 用户协议系统集成示例 -->

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>命运塔 - 用户协议集成示例</title>
    
    <!-- 用户协议样式 -->
    <link rel="stylesheet" href="user-agreement.css">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
        }
        
        .game-container {
            padding: 50px;
            text-align: center;
        }
        
        .game-title {
            font-size: 48px;
            color: #ffd700;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }
        
        .game-status {
            font-size: 18px;
            color: #888;
            margin-top: 30px;
        }
        
        .agreement-status {
            display: inline-block;
            padding: 10px 20px;
            border-radius: 20px;
            margin-top: 20px;
            font-size: 14px;
        }
        
        .agreement-status.agreed {
            background: rgba(76, 175, 80, 0.2);
            color: #4caf50;
        }
        
        .agreement-status.pending {
            background: rgba(255, 193, 7, 0.2);
            color: #ffc107;
        }
        
        .btn-view-agreement {
            margin-top: 20px;
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            transition: transform 0.3s;
        }
        
        .btn-view-agreement:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1 class="game-title">🗼 命运塔</h1>
        <p>全球卡牌对战竞技游戏</p>
        
        <div id="status-container">
            <div class="game-status">用户协议状态</div>
            <div id="agreement-status" class="agreement-status pending">检测中...</div>
        </div>
        
        <button class="btn-view-agreement" onclick="userAgreementManager.init()">
            重新查看用户协议
        </button>
    </div>
    
    <!-- 用户协议多语言脚本 -->
    <script src="toweroffate-user-agreement-i18n.js"></script>
    
    <script>
        // 监听用户协议同意事件
        window.addEventListener('userAgreementAccepted', function(e) {
            console.log('用户协议已同意，语言：', e.detail.lang);
            updateStatus(true, e.detail.lang);
        });
        
        // 更新状态显示
        function updateStatus(agreed, lang) {
            const statusEl = document.getElementById('agreement-status');
            if (agreed) {
                statusEl.className = 'agreement-status agreed';
                statusEl.textContent = `✅ 已同意 (${lang})`;
            } else {
                statusEl.className = 'agreement-status pending';
                statusEl.textContent = '⏳ 等待同意';
            }
        }
        
        // 页面加载时检查状态
        document.addEventListener('DOMContentLoaded', function() {
            const hasAgreed = localStorage.getItem('agreed-versions');
            if (hasAgreed) {
                const agreedVersions = JSON.parse(hasAgreed);
                const currentLang = localStorage.getItem('user-agreement-lang') || 'zh-CN';
                if (agreedVersions[currentLang]) {
                    updateStatus(true, currentLang);
                } else {
                    updateStatus(false);
                }
            } else {
                updateStatus(false);
            }
        });
    </script>
</body>
</html>
