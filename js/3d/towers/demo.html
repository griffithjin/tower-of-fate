<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Allegro 3D Towers - 196个国家塔模型展示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            overflow: hidden;
        }
        
        #container {
            display: flex;
            height: 100vh;
        }
        
        #sidebar {
            width: 280px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            padding: 20px;
            overflow-y: auto;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        #sidebar h1 {
            color: #ffd700;
            font-size: 1.5rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
        
        #sidebar .subtitle {
            color: #aaa;
            font-size: 0.85rem;
            margin-bottom: 20px;
        }
        
        .stats {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
        }
        
        .stats h3 {
            color: #fff;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }
        
        .stat-item {
            display: flex;
            justify-content: space-between;
            color: #ccc;
            font-size: 0.85rem;
            margin: 5px 0;
        }
        
        .stat-value {
            color: #ffd700;
            font-weight: bold;
        }
        
        #tower-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .tower-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            padding: 12px 15px;
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .tower-btn:hover {
            background: rgba(255, 215, 0, 0.2);
            transform: translateX(5px);
        }
        
        .tower-btn.active {
            background: rgba(255, 215, 0, 0.3);
            border: 1px solid #ffd700;
        }
        
        .tower-flag {
            font-size: 1.2rem;
        }
        
        .tower-info {
            flex: 1;
        }
        
        .tower-name {
            font-weight: 500;
            font-size: 0.95rem;
        }
        
        .tower-template {
            font-size: 0.75rem;
            color: #888;
            text-transform: uppercase;
        }
        
        #canvas-container {
            flex: 1;
            position: relative;
        }
        
        #canvas {
            width: 100%;
            height: 100%;
        }
        
        #info-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 10px;
            color: #fff;
            min-width: 200px;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }
        
        #info-panel h2 {
            color: #ffd700;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }
        
        .layer-info {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 8px 0;
            font-size: 0.9rem;
        }
        
        .layer-badge {
            background: rgba(255, 215, 0, 0.3);
            color: #ffd700;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        
        .controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            padding: 15px 25px;
            border-radius: 30px;
            display: flex;
            gap: 15px;
            align-items: center;
        }
        
        .control-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }
        
        .control-btn:hover {
            background: rgba(255, 215, 0, 0.3);
        }
        
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffd700;
            font-size: 1.5rem;
            text-align: center;
        }
        
        .loading::after {
            content: '';
            display: block;
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 215, 0, 0.3);
            border-top-color: #ffd700;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="container">
        <aside id="sidebar">
            <h1>🏗️ Allegro 3D Towers</h1>
            <div class="subtitle">196个国家塔模型系统</div>
            
            <div class="stats">
                <h3>📊 统计数据</h3>
                <div class="stat-item">
                    <span>总塔数</span>
                    <span class="stat-value" id="stat-total">196</span>
                </div>
                <div class="stat-item">
                    <span>总层数</span>
                    <span class="stat-value" id="stat-layers">2,548</span>
                </div>
                <div class="stat-item">
                    <span>球体塔</span>
                    <span class="stat-value" id="stat-sphere">-</span>
                </div>
                <div class="stat-item">
                    <span>铁架塔</span>
                    <span class="stat-value" id="stat-lattice">-</span>
                </div>
                <div class="stat-item">
                    <span>金字塔</span>
                    <span class="stat-value" id="stat-pyramid">-</span>
                </div>
                <div class="stat-item">
                    <span>现代塔</span>
                    <span class="stat-value" id="stat-modern">-</span>
                </div>
            </div>
            
            <div id="tower-list"></div>
        </aside>
        
        <main id="canvas-container">
            <div id="loading" class="loading">正在加载3D引擎...</div>
            <canvas id="canvas"></canvas>
            
            <div id="info-panel" style="display: none;">
                <h2 id="current-tower">选择一座塔</h2>
                <div id="tower-details"></div>
            </div>
            
            <div class="controls">
                <button class="control-btn" onclick="rotateTower()">🔄 旋转</button>
                <button class="control-btn" onclick="toggleWireframe()">🔲 线框</button>
                <button class="control-btn" onclick="resetView()">🏠 重置视角</button>
                <button class="control-btn" onclick="toggleAutoRotate()">▶️ 自动旋转</button>
            </div>
        </main>
    </div>

    <!-- Three.js -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import Allegro3DTowers from './index.js';
        
        // 全局变量
        let scene, camera, renderer, controls, currentTower;
        let allegroTowers;
        let autoRotate = false;
        let isWireframe = false;
        
        // 初始化
        async function init() {
            const canvas = document.getElementById('canvas');
            
            // 场景
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a2e);
            scene.fog = new THREE.Fog(0x1a1a2e, 10, 50);
            
            // 相机
            camera = new THREE.PerspectiveCamera(60, canvas.clientWidth / canvas.clientHeight, 0.1, 1000);
            camera.position.set(8, 6, 8);
            
            // 渲染器
            renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
            renderer.setSize(canvas.clientWidth, canvas.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            
            // 控制器
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = 3;
            controls.maxDistance = 30;
            
            // 灯光
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
            directionalLight.position.set(10, 20, 10);
            directionalLight.castShadow = true;
            scene.add(directionalLight);
            
            const pointLight = new THREE.PointLight(0xffd700, 0.5, 20);
            pointLight.position.set(0, 10, 0);
            scene.add(pointLight);
            
            // 网格地面
            const gridHelper = new THREE.GridHelper(20, 20, 0x444444, 0x222222);
            scene.add(gridHelper);
            
            // 初始化Allegro 3D Towers
            allegroTowers = new Allegro3DTowers();
            await allegroTowers.init();
            
            // 更新统计
            updateStats();
            
            // 创建塔列表
            createTowerList();
            
            // 默认显示中国塔
            loadTower('tower-cn');
            
            // 隐藏加载
            document.getElementById('loading').style.display = 'none';
            document.getElementById('info-panel').style.display = 'block';
            
            // 窗口调整
            window.addEventListener('resize', onWindowResize);
            
            // 开始渲染循环
            animate();
        }
        
        function updateStats() {
            const stats = allegroTowers.getStats();
            document.getElementById('stat-total').textContent = stats.totalTowers;
            document.getElementById('stat-layers').textContent = stats.totalLayers.toLocaleString();
            document.getElementById('stat-sphere').textContent = stats.templateDistribution.sphere;
            document.getElementById('stat-lattice').textContent = stats.templateDistribution.lattice;
            document.getElementById('stat-pyramid').textContent = stats.templateDistribution.pyramid;
            document.getElementById('stat-modern').textContent = stats.templateDistribution.modern;
        }
        
        function createTowerList() {
            const list = document.getElementById('tower-list');
            const configs = allegroTowers.getAllConfigs();
            
            // 特殊塔优先
            const specialOrder = ['tower-cn', 'tower-fr', 'tower-eg', 'tower-jp', 'tower-us', 'tower-gb', 'tower-ru'];
            const sortedIds = [
                ...specialOrder.filter(id => configs[id]),
                ...Object.keys(configs).filter(id => !specialOrder.includes(id))
            ];
            
            sortedIds.forEach(towerId => {
                const config = configs[towerId];
                const btn = document.createElement('button');
                btn.className = 'tower-btn';
                btn.dataset.towerId = towerId;
                
                const flag = getFlagEmoji(config.code);
                const templateIcon = getTemplateIcon(config.template);
                
                btn.innerHTML = `
                    <span class="tower-flag">${flag}</span>
                    <div class="tower-info">
                        <div class="tower-name">${config.name}</div>
                        <div class="tower-template">${templateIcon} ${config.template}</div>
                    </div>
                `;
                
                btn.addEventListener('click', () => loadTower(towerId));
                list.appendChild(btn);
            });
        }
        
        function getFlagEmoji(countryCode) {
            const codePoints = countryCode
                .toUpperCase()
                .slice(0, 2)
                .split('')
                .map(char => 127397 + char.charCodeAt());
            return String.fromCodePoint(...codePoints);
        }
        
        function getTemplateIcon(template) {
            const icons = {
                sphere: '🔮',
                lattice: '🗼',
                pyramid: '🔺',
                modern: '🏢'
            };
            return icons[template] || '🏗️';
        }
        
        function loadTower(towerId) {
            // 移除当前塔
            if (currentTower) {
                scene.remove(currentTower);
            }
            
            // 生成新塔
            currentTower = allegroTowers.generateTower(towerId);
            if (currentTower) {
                scene.add(currentTower);
                
                // 更新UI
                document.querySelectorAll('.tower-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.towerId === towerId);
                });
                
                const config = allegroTowers.getConfig(towerId);
                updateInfoPanel(config);
            }
        }
        
        function updateInfoPanel(config) {
            document.getElementById('current-tower').textContent = `${getFlagEmoji(config.code)} ${config.name}`;
            
            const details = document.getElementById('tower-details');
            details.innerHTML = `
                <div class="layer-info">
                    <span class="layer-badge">ID</span>
                    <span>${config.id}</span>
                </div>
                <div class="layer-info">
                    <span class="layer-badge">类型</span>
                    <span>${getTemplateIcon(config.template)} ${config.template}</span>
                </div>
                <div class="layer-info">
                    <span class="layer-badge">层数</span>
                    <span>13层 (A-2)</span>
                </div>
                <div class="layer-info">
                    <span class="layer-badge">玩家</span>
                    <span>每层4个位置</span>
                </div>
                <div class="layer-info">
                    <span class="layer-badge">守卫</span>
                    <span>每层4个位置</span>
                </div>
            `;
        }
        
        function onWindowResize() {
            const canvas = document.getElementById('canvas');
            camera.aspect = canvas.clientWidth / canvas.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(canvas.clientWidth, canvas.clientHeight);
        }
        
        function animate() {
            requestAnimationFrame(animate);
            
            controls.update();
            
            if (autoRotate && currentTower) {
                currentTower.rotation.y += 0.005;
            }
            
            renderer.render(scene, camera);
        }
        
        // 全局控制函数
        window.rotateTower = () => {
            if (currentTower) {
                currentTower.rotation.y += Math.PI / 2;
            }
        };
        
        window.toggleWireframe = () => {
            isWireframe = !isWireframe;
            if (currentTower) {
                currentTower.traverse(child => {
                    if (child.isMesh && child.material) {
                        if (Array.isArray(child.material)) {
                            child.material.forEach(m => m.wireframe = isWireframe);
                        } else {
                            child.material.wireframe = isWireframe;
                        }
                    }
                });
            }
        };
        
        window.resetView = () => {
            camera.position.set(8, 6, 8);
            controls.reset();
        };
        
        window.toggleAutoRotate = () => {
            autoRotate = !autoRotate;
        };
        
        // 启动
        init().catch(console.error);
    </script>
</body>
</html>
